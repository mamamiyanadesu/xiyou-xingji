<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地图接入 · 西游行记</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><main class="page" style="max-width:780px"><span class="eyebrow">开发者设置 · 当前标签页</span><h1>连接百度地图</h1><p>这里使用浏览器端 JSAPI AK，不是 MCP 服务端密钥，也不是 SK。请在百度地图控制台启用 JSAPI，并把当前开发地址加入允许的域名。</p><p>AK 仅保存在当前标签页会话，不进入阅读备份。关闭标签页后需重新配置；正式部署时应通过受域名限制的浏览器 AK 接入。</p><form id="setup"><label for="ak">浏览器端 AK</label><input id="ak" type="password" autocomplete="off" spellcheck="false" required minlength="10" maxlength="128" style="display:block;width:100%;margin:12px 0"><button class="primary">保存并返回地图</button> <a href="index.html#story=changan&view=map">返回应用</a></form><p id="message" role="status"></p><p><a href="https://lbsyun.baidu.com/apiconsole/key" target="_blank" rel="noopener">百度地图控制台 ↗</a> · <a href="https://lbs.baidu.com/docs/jsapi?title=jsapi4%2Fupgrade" target="_blank" rel="noopener">JSAPI 4.0 文档 ↗</a></p><p>此前 MCP 返回服务激活超时。MCP 与网页 JSAPI 是两条接入路径，需要分别验证。</p></main><script>document.querySelector('#setup').onsubmit=e=>{e.preventDefault();const key=document.querySelector('#ak').value.trim();if(!/^[A-Za-z0-9_-]{10,128}$/.test(key)){document.querySelector('#message').textContent='请输入有效的浏览器端 AK。';return}try{sessionStorage.setItem('xiyou-baidu-ak',key);location.href='index.html#story=changan&view=map'}catch{document.querySelector('#message').textContent='浏览器阻止了会话存储，请检查设置。'}};</script></body></html>
